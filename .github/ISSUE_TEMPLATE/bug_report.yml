name: Bug report
description: Report a problem with a Tekton Task
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the details below.
  - type: input
    id: task
    attributes:
      label: Affected Task
      description: Which task is affected (e.g. `groovy`)?
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Paste the Pipeline/PipelineRun or example script used.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Tekton Pipelines version and platform (e.g. linux/amd64).
